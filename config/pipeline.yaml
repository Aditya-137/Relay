# config/pipeline.yaml
# Core configuration for the Vaani RAG pipeline.
# All parameters are decoupled here to ensure loose coupling.

model:
  name: "qwen/qwen3.8-27b"
  temperature: 0.1
  max_output_tokens: 512
  json_mode: true

retrieval:
  default_preset: "preset_512"
  candidate_k: 15                 # Candidate pool retrieved by HybridSearcher
  top_k: 3                        # Chunks passed to Drafter after reranking
  alpha: 0.5                      # Linear combination weight (0.5 = 50% dense, 50% sparse)
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rejection_threshold: 0.0        # Cross-encoder score gate (scores < 0.0 are rejected out-of-domain)

orchestration:
  max_retries: 1                  # Maximum retry attempts on refusal or validation failure
  adaptive_degradation_threshold: 0.80  # Quota threshold (80%) to activate RT + Caveman-Lite
  degraded_preset: "preset_256"   # Smaller chunks when quota usage > 80%
  degraded_top_k: 2               # Fewer chunks when quota usage > 80%
  timeouts:
    ttft_max_ms: 3000
    total_max_ms: 10000

